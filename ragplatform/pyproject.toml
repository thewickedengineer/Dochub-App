[project]
name = "rag-ingest"
version = "0.6.0"
description = "Ingestion side of the Dochub RAG platform: queue → extract → chunk → embed → hybrid index."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "azure-storage-blob>=12.20",
  # The async Blob client needs an async transport; azure-core does not bring one.
  "aiohttp>=3.9",
  "azure-servicebus>=7.12",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "tiktoken>=0.7",
  "tokenizers>=0.19",
  "markdown-it-py>=3.0",
  "nbformat>=5.10",
  "puremagic>=1.27",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.9",
  "lingua-language-detector>=2.0",
  "openai>=1.40",
  "anthropic>=1.0",
  "opentelemetry-api>=1.45",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
# Real local embeddings (ONNX). Used when EMBEDDING_PROVIDER=local.
local = ["fastembed>=0.4"]
# libmagic-backed sniffing; needs the system library (installed in the Docker image).
magic = ["python-magic>=0.4"]
# PDF, Word, PowerPoint, HTML and images (layout, tables, OCR). Pulls in torch.
docs = ["docling>=2.130"]
# Audio and video transcription. Also needs the ffmpeg and ffprobe binaries on PATH.
media = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[project.scripts]
rag-ingest = "rag_ingest.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# A hung test fails instead of stalling the run.
timeout = 120
markers = [
  "integration: needs the docker-compose Postgres instances and Azurite",
  "slow: loads Docling or Whisper models (the first run downloads them)",
]
